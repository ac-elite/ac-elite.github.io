name: Deploy AC Elite to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync KMR Data", "Daily Rank Snapshot (24h)", "Current Track Snapshot (GitHub)"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site for GitHub Pages
        env:
          # Optional: site visit counter (see scripts/supabase-site-stats.sql)
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Serve the large rank/leaderboard JSON from GitHub Pages by default.
          # Supabase Storage remains a manual opt-in source, not the public CDN.
          VITE_SUPABASE_KMR_STORAGE: "0"
          # Keep the public site responsive if Supabase starts returning 522/544.
          VITE_SUPABASE_FETCH_TIMEOUT_MS: "2000"
          VITE_SUPABASE_STORAGE_TIMEOUT_MS: "1500"
          VITE_SUPABASE_UNHEALTHY_COOLDOWN_MS: "300000"
        run: |
          BASE_PATH="/${{ github.event.repository.name }}/"
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            BASE_PATH="/"
          fi
          npm run build -- --base="$BASE_PATH"

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
