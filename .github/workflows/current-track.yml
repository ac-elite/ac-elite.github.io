name: Current Track Snapshot (GitHub)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

on:
  # Check current track every hour.
  schedule:
    - cron: "5 * * * *"

  workflow_dispatch:

# Serialize with other workflows that commit to main (avoids push races).
concurrency:
  group: bot-push-main
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Guard
        id: guard
        run: |
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Fetch current track
        if: steps.guard.outputs.run == 'true'
        run: |
          DEST="public/data/current-track.json"
          mkdir -p public/data

          HTTP_RESPONSE=$(curl -s --max-time 8 "http://157.90.3.32:18283/INFO" 2>/dev/null) || HTTP_RESPONSE=""

          if [ -z "$HTTP_RESPONSE" ]; then
            echo '{"online":false,"track":"","fetchedAt":"'"$(date -u +'%Y-%m-%dT%H:%M:%SZ')"'","info":{}}' > "$DEST"
          else
            echo "$HTTP_RESPONSE" | python3 -c "
          import json, pathlib, sys

          _TRACK_CATALOG_PATH = pathlib.Path('src/centralized/track-catalog.json')
          _TRACK_ID_ALIASES = {}
          try:
              catalog = json.loads(_TRACK_CATALOG_PATH.read_text(encoding='utf-8'))
              for row in catalog:
                  canon = row.get('id')
                  if not isinstance(canon, str) or not canon:
                      continue
                  aliases = row.get('aliases', [])
                  if isinstance(aliases, list):
                      for alias in aliases:
                          if isinstance(alias, str) and alias:
                              _TRACK_ID_ALIASES[alias] = canon
          except Exception:
              _TRACK_ID_ALIASES = {}

          def normalize_track_id(track):
              if not isinstance(track, str):
                  return ''
              t = track.replace('-layout', '_layout').replace('-', '_')
              return _TRACK_ID_ALIASES.get(t, t)
          try:
              data = json.load(sys.stdin)
              track = normalize_track_id(data.get('track', ''))
              info = dict(data)
              info['track'] = track
              out = {
                  'online': True,
                  'track': track,
                  'fetchedAt': '$(date -u +%Y-%m-%dT%H:%M:%SZ)',
                  'info': info,
              }
              json.dump(out, sys.stdout, separators=(',', ':'))
          except Exception:
              json.dump({'online': False, 'track': '', 'fetchedAt': '$(date -u +%Y-%m-%dT%H:%M:%SZ)', 'info': {}}, sys.stdout, separators=(',', ':'))
          " > "$DEST"
          fi

      - name: Commit and push
        if: steps.guard.outputs.run == 'true'
        run: |
          git add public/data/current-track.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            # Ensure identity exists for any rebase-generated commits too.
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"

            git commit -m "Daily current track update - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            ok=false
            for attempt in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push origin main; then
                ok=true
                break
              fi
              [ "$attempt" -eq 5 ] && break
              sleep $((attempt * 4))
            done
            if [ "$ok" != "true" ]; then
              echo "Push failed after 5 attempts"
              exit 1
            fi
          fi
