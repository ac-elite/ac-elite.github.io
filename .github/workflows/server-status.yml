name: Server Status

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

concurrency:
  group: server-status
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch server status
        run: |
          DEST="public/data/server-status.json"
          mkdir -p public/data

          HTTP_RESPONSE=$(curl -s --max-time 8 "http://157.90.3.32:18283/INFO" 2>/dev/null) || HTTP_RESPONSE=""

          if [ -z "$HTTP_RESPONSE" ]; then
            echo '{"online":false,"clients":0,"maxclients":0,"track":"","fetchedAt":"'"$(date -u +'%Y-%m-%dT%H:%M:%SZ')"'"}' > "$DEST"
            echo "Server unreachable, wrote offline status"
          else
            echo "$HTTP_RESPONSE" | python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
              out = {
                  'online': True,
                  'clients': data.get('clients', 0),
                  'maxclients': data.get('maxclients', 0),
                  'track': data.get('track', ''),
                  'session': data.get('session', 0),
                  'timeleft': data.get('timeleft', 0),
                  'fetchedAt': '$(date -u +%Y-%m-%dT%H:%M:%SZ)',
              }
              json.dump(out, sys.stdout, separators=(',', ':'))
          except Exception:
              json.dump({'online': False, 'clients': 0, 'maxclients': 0, 'track': '', 'fetchedAt': '$(date -u +%Y-%m-%dT%H:%M:%SZ)'}, sys.stdout, separators=(',', ':'))
          " > "$DEST"
            echo "Wrote server status"
          fi

          cat "$DEST"

      - name: Commit and push
        run: |
          git add public/data/server-status.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git -c user.email="github-actions[bot]@users.noreply.github.com" \
                -c user.name="github-actions[bot]" \
                commit -m "Server status update - $(date -u +'%H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi
