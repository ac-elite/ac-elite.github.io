name: Sync KMR Data

permissions:
  contents: write

# Serialize with other workflows that commit to main (avoids push races).
concurrency:
  group: bot-push-main
  cancel-in-progress: false

on:
  # Temporary public stats source until Cloudflare/R2 is in place.
  # Keep KMR rank/leaderboard fresh without using Supabase Storage as the CDN.
  schedule:
    - cron: '0,30 * * * *'

  # Allow manual trigger
  workflow_dispatch:

  # Run on source code changes (not data-only pushes)
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install basic-ftp

      - name: Fetch data from FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          node << 'EOF'
          const ftp = require('basic-ftp');
          const fs = require('fs');
          const path = require('path');

          function parseJsonFile(filePath, label) {
              const raw = fs.readFileSync(filePath, 'utf8');
              if (!raw || !raw.trim()) {
                  throw new Error(`${label} is empty`);
              }
              try {
                  return JSON.parse(raw);
              } catch (err) {
                  throw new Error(`${label} is not valid JSON: ${err.message}`);
              }
          }

          function getCandidateRemotePaths(fileName) {
              return [
                  `kissmyrank/${fileName}`,
                  `/kissmyrank/${fileName}`,
                  fileName,
                  `/${fileName}`
              ];
          }

          async function downloadJsonWithFallback(client, dataDir, fileName) {
              const candidates = getCandidateRemotePaths(fileName);
              let lastError = null;

              for (const remotePath of candidates) {
                  try {
                      await downloadJsonAtomically(client, dataDir, remotePath, fileName);
                      console.log(`✓ Remote path resolved for ${fileName}: ${remotePath}`);
                      return;
                  } catch (err) {
                      lastError = err;
                      console.log(`- Failed path for ${fileName}: ${remotePath} (${err.message})`);
                  }
              }

              throw new Error(
                  `Could not download ${fileName} from any known path (${candidates.join(', ')}). Last error: ${lastError?.message || 'unknown'}`
              );
          }

          async function downloadJsonAtomically(client, dataDir, remotePath, fileName) {
              const finalPath = path.join(dataDir, fileName);
              const tempPath = `${finalPath}.tmp`;

              try {
                  if (fs.existsSync(tempPath)) fs.unlinkSync(tempPath);
                  await client.downloadTo(tempPath, remotePath);
                  parseJsonFile(tempPath, fileName);
                  fs.renameSync(tempPath, finalPath);
                  console.log(`✓ Downloaded and validated ${fileName}`);
              } catch (err) {
                  if (fs.existsSync(tempPath)) fs.unlinkSync(tempPath);
                  throw err;
              }
          }

          function readRank24hSnapshotAt(dataDir) {
              const metaPath = path.join(dataDir, 'metadata.json');
              try {
                  if (!fs.existsSync(metaPath)) return undefined;
                  const prev = JSON.parse(fs.readFileSync(metaPath, 'utf8'));
                  const v = prev && typeof prev.rank24hSnapshotAt === 'string' ? prev.rank24hSnapshotAt.trim() : '';
                  return v || undefined;
              } catch {
                  return undefined;
              }
          }

          async function syncData() {
              const client = new ftp.Client();
              client.ftp.verbose = false;
              
              // Ensure public data directory exists
              const dataDir = path.join(process.cwd(), 'public', 'data');
              if (!fs.existsSync(dataDir)) {
                  fs.mkdirSync(dataDir, { recursive: true });
              }
              const preservedRank24hAt = readRank24hSnapshotAt(dataDir);
              
              try {
                  console.log('Connecting to FTP server...');
                  await client.access({
                      host: process.env.FTP_HOST,
                      user: process.env.FTP_USER,
                      password: process.env.FTP_PASS,
                      secure: false
                  });
                  
                  console.log('Connected! Downloading files...');
                  console.log(`FTP current directory: ${await client.pwd()}`);
                  try {
                      const listing = await client.list();
                      const names = listing.map((entry) => entry.name).slice(0, 30);
                      console.log(`FTP root entries (first ${names.length}): ${names.join(', ')}`);
                  } catch (listErr) {
                      console.log(`Could not list FTP directory: ${listErr.message}`);
                  }

                  // Download + validate required data files.
                  await downloadJsonWithFallback(client, dataDir, 'rank.json');
                  await downloadJsonWithFallback(client, dataDir, 'leaderboard.json');

                  // Sanity-check shape to avoid committing garbage.
                  const rank = parseJsonFile(path.join(dataDir, 'rank.json'), 'rank.json');
                  const leaderboard = parseJsonFile(path.join(dataDir, 'leaderboard.json'), 'leaderboard.json');
                  if (!Array.isArray(rank)) {
                      throw new Error('rank.json must contain a JSON array');
                  }
                  if (!leaderboard || Array.isArray(leaderboard) || typeof leaderboard !== 'object') {
                      throw new Error('leaderboard.json must contain a JSON object');
                  }

                  // Create metadata file with sync timestamp (preserve daily snapshot stamp)
                  const metadata = {
                      lastSync: new Date().toISOString(),
                      status: 'success',
                      ...(preservedRank24hAt ? { rank24hSnapshotAt: preservedRank24hAt } : {})
                  };
                  fs.writeFileSync(
                      path.join(dataDir, 'metadata.json'),
                      JSON.stringify(metadata, null, 2)
                  );
                  console.log('✓ Created metadata.json');
                  
              } catch (err) {
                  console.error('Sync failed:', err.message);
                  
                  // Create error metadata (preserve daily snapshot stamp when possible)
                  const metadata = {
                      lastSync: new Date().toISOString(),
                      status: 'error',
                      error: err.message,
                      ...(preservedRank24hAt ? { rank24hSnapshotAt: preservedRank24hAt } : {})
                  };
                  fs.writeFileSync(
                      path.join(dataDir, 'metadata.json'),
                      JSON.stringify(metadata, null, 2)
                  );
                  
                  process.exit(1);
              } finally {
                  client.close();
              }
              
              console.log('Sync completed!');
          }

          syncData();
          EOF

      - name: Export rating v2 snapshot
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');

          async function main() {
            const dataDir = path.join(process.cwd(), 'public', 'data');
            const finalPath = path.join(dataDir, 'rating-v2.json');
            const minExportIntervalMs = 60 * 60 * 1000;
            const forceExport = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch';

            if (!forceExport && fs.existsSync(finalPath)) {
              try {
                const existing = JSON.parse(fs.readFileSync(finalPath, 'utf8'));
                const generatedAt = Date.parse(existing.generatedAt || '');
                if (Number.isFinite(generatedAt) && Date.now() - generatedAt < minExportIntervalMs) {
                  console.log('rating-v2.json is still fresh; skipping Supabase export.');
                  return;
                }
              } catch {
                console.log('rating-v2.json exists but could not be read; refreshing snapshot.');
              }
            }

            const supabaseUrl = (process.env.SUPABASE_URL || '').trim().replace(/\/$/, '');
            const supabaseKey = (process.env.SUPABASE_ANON_KEY || '').trim();
            if (!supabaseUrl || !supabaseKey) {
              console.log('Supabase read secrets missing; skipping rating-v2.json export.');
              return;
            }

            const select = [
              'guid',
              'name',
              'license_tier',
              'license_score',
              'safety_tier',
              'safety_rating',
              'confidence',
              'rated_sessions',
              'rated_km',
              'computed_at',
            ];

            function supabaseHeaders(extra = {}) {
              const headers = {
                apikey: supabaseKey,
                'Content-Type': 'application/json',
                ...extra,
              };
              if (!supabaseKey.startsWith('sb_')) headers.Authorization = `Bearer ${supabaseKey}`;
              return headers;
            }

            function mapRating(row) {
              return {
                guid: row.guid,
                name: row.name || '',
                licenseTier: row.license_tier,
                licenseScore: row.license_score,
                safetyTier: row.safety_tier,
                safetyRating: row.safety_rating,
                confidence: row.confidence,
                ratedSessions: row.rated_sessions,
                ratedKm: row.rated_km,
                computedAt: row.computed_at,
              };
            }

            async function fetchPage(from) {
              const to = from + 999;
              const params = new URLSearchParams({
                select: select.join(','),
                order: 'license_score.desc',
              });
              const res = await fetch(`${supabaseUrl}/rest/v1/driver_ratings_v2?${params.toString()}`, {
                headers: supabaseHeaders({
                  'Range-Unit': 'items',
                  Range: `${from}-${to}`,
                }),
              });
              if (!res.ok) {
                throw new Error(`driver_ratings_v2 export failed: ${res.status} ${res.statusText}`);
              }
              return res.json();
            }

            const ratings = [];
            for (let from = 0; ; from += 1000) {
              const rows = await fetchPage(from);
              ratings.push(...rows.map(mapRating));
              if (rows.length < 1000) break;
            }

            fs.mkdirSync(dataDir, { recursive: true });
            const tempPath = `${finalPath}.tmp`;
            fs.writeFileSync(tempPath, JSON.stringify({ generatedAt: new Date().toISOString(), ratings }));
            JSON.parse(fs.readFileSync(tempPath, 'utf8'));
            fs.renameSync(tempPath, finalPath);
            console.log(`Exported ${ratings.length} rating v2 rows to public/data/rating-v2.json`);
          }

          main().catch((error) => {
            console.log(`Rating v2 snapshot export skipped: ${error.message}`);
          });
          EOF

      - name: Commit and push changes
        run: |
          # Never allow accidental deletion of required live data files.
          if [ ! -f public/data/rank.json ] || [ ! -f public/data/leaderboard.json ]; then
            echo "Required files missing; aborting commit."
            exit 1
          fi

          git add public/data/

          if git diff --staged --name-status | grep -E '^D[[:space:]]+public/data/(rank|leaderboard)\.json$' >/dev/null; then
            echo "Refusing to commit deletion of rank.json or leaderboard.json."
            exit 1
          fi

          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            # Ensure identity exists for any rebase-generated commits too.
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"

            git commit -m "🔄 Sync KMR data - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            ok=false
            for attempt in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push origin main; then
                ok=true
                break
              fi
              [ "$attempt" -eq 5 ] && break
              sleep $((attempt * 4))
            done
            if [ "$ok" != "true" ]; then
              echo "Push failed after 5 attempts"
              exit 1
            fi
          fi
