name: Daily Rank Snapshot (24h)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

on:
  workflow_run:
    workflows: ["Sync KMR Data"]
    types: [completed]
    branches: [main]

  workflow_dispatch:

jobs:
  snapshot:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if this is the first successful sync of the UTC day
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run requested"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TODAY_UTC=$(date -u +'%Y-%m-%d')
          LAST_SNAPSHOT_DATE=$(git log -1 --format=%cs -- public/data/rank-24h.json || true)

          if [ -z "$LAST_SNAPSHOT_DATE" ]; then
            echo "No previous snapshot commit found, running now"
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$LAST_SNAPSHOT_DATE" != "$TODAY_UTC" ]; then
            echo "No snapshot exists yet for $TODAY_UTC (last: $LAST_SNAPSHOT_DATE), running now"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Snapshot already created for $TODAY_UTC, skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create 24h snapshot
        if: steps.guard.outputs.run == 'true'
        run: |
          SRC="public/data/rank.json"
          DEST="public/data/rank-24h.json"

          if [ ! -f "$SRC" ]; then
            echo "No rank.json found, skipping snapshot"
            exit 0
          fi

          cp "$SRC" "$DEST"
          echo "Created 24h snapshot from rank.json"

      - name: Commit and push snapshot
        if: steps.guard.outputs.run == 'true'
        run: |
          git add public/data/rank-24h.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git -c user.email="github-actions[bot]@users.noreply.github.com" -c user.name="github-actions[bot]" commit -m "Daily 24h rank snapshot - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git pull --rebase --autostash
            git push
          fi
