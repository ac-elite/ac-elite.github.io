name: Daily Rank Snapshot (24h)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

# Serialize with other workflows that commit to main (avoids push races).
concurrency:
  group: bot-push-main
  cancel-in-progress: false

on:
  workflow_run:
    workflows: ["Sync KMR Data"]
    types: [completed]
    branches: [main]

  workflow_dispatch:

jobs:
  snapshot:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if this is the first successful sync after 06:00 local
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run requested"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TZ_NAME="Europe/Amsterdam"
          TODAY_LOCAL=$(TZ="$TZ_NAME" date +'%Y-%m-%d')
          HOUR_LOCAL=$(TZ="$TZ_NAME" date +'%H')
          LAST_SNAPSHOT_EPOCH=$(git log -1 --format=%ct -- public/data/rank-24h.json || true)
          LAST_SNAPSHOT_DATE=""
          if [ -n "$LAST_SNAPSHOT_EPOCH" ]; then
            LAST_SNAPSHOT_DATE=$(TZ="$TZ_NAME" date -d "@$LAST_SNAPSHOT_EPOCH" +'%Y-%m-%d')
          fi

          if [ "$HOUR_LOCAL" -lt 6 ]; then
            echo "Skipping — snapshot runs after 06:00 $TZ_NAME (current local hour: $HOUR_LOCAL)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$LAST_SNAPSHOT_DATE" ]; then
            echo "No previous snapshot commit found, running now"
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$LAST_SNAPSHOT_DATE" != "$TODAY_LOCAL" ]; then
            echo "No snapshot exists yet for $TODAY_LOCAL (last: $LAST_SNAPSHOT_DATE), running now"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Snapshot already created for $TODAY_LOCAL, skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create 24h snapshot
        if: steps.guard.outputs.run == 'true'
        run: |
          SRC="public/data/rank.json"
          DEST="public/data/rank-24h.json"

          if [ ! -f "$SRC" ]; then
            echo "No rank.json found, skipping snapshot"
            exit 0
          fi

          cp "$SRC" "$DEST"
          echo "Created 24h snapshot from rank.json"

          META="public/data/metadata.json"
          if [ -f "$META" ]; then
            node -e "
              const fs = require('fs');
              const p = 'public/data/metadata.json';
              const m = JSON.parse(fs.readFileSync(p, 'utf8'));
              m.rank24hSnapshotAt = new Date().toISOString();
              fs.writeFileSync(p, JSON.stringify(m, null, 2) + '\n');
            "
            echo "Stamped rank24hSnapshotAt in metadata.json"
          else
            echo "Warning: metadata.json missing; rank-24h freshness will stay unknown until metadata exists"
          fi

      - name: Commit and push snapshot
        if: steps.guard.outputs.run == 'true'
        run: |
          git add public/data/rank-24h.json public/data/metadata.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            # Ensure identity exists for any rebase-generated commits too.
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"

            git commit -m "Daily 24h rank snapshot - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            ok=false
            for attempt in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push origin main; then
                ok=true
                break
              fi
              [ "$attempt" -eq 5 ] && break
              sleep $((attempt * 4))
            done
            if [ "$ok" != "true" ]; then
              echo "Push failed after 5 attempts"
              exit 1
            fi
          fi
